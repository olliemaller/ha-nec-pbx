blueprint:
  name: NEC PBX – missed call notification
  description: >-
    Sends a phone notification when a call to the house phones goes unanswered.
    Uses the **Call** event entity from the NEC PBX integration, so the caller's
    name comes from your phonebook when it's there.
  domain: automation
  author: olliemaller
  source_url: https://github.com/olliemaller/ha-nec-pbx/blob/main/blueprints/automation/nec_pbx/missed_call_notification.yaml
  homeassistant:
    min_version: "2026.7.0"
  input:
    call_event:
      name: Call event
      description: The NEC PBX "Call" entity, for example event.house_phones_call.
      selector:
        entity:
          filter:
            - integration: nec_pbx
              domain: event
    notify_device:
      name: Phone to notify
      description: A phone with the Home Assistant app.
      selector:
        device:
          filter:
            - integration: mobile_app
    title:
      name: Title
      default: Missed call
      selector:
        text:

triggers:
  - trigger: event.received
    target:
      entity_id: !input call_event
    options:
      event_type:
        - missed

variables:
  call: "{{ trigger.to_state.attributes }}"
  caller: "{{ call.caller_name or call.number or 'an unknown number' }}"
  room: "{{ call.station_name or call.station or '' }}"
  when: "{{ as_timestamp(call.start or now()) | timestamp_custom('%-I:%M %p') }}"

actions:
  - domain: mobile_app
    type: notify
    device_id: !input notify_device
    title: !input title
    message: >-
      {{ caller }} at {{ when }}{{ ' (rang ' ~ room ~ ')' if room else '' }}

mode: queued
max: 10
