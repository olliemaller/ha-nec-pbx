name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check the tag matches manifest.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(jq -r .version custom_components/nec_pbx/manifest.json)"
          if [ "$tag" != "$version" ]; then
            echo "Tag v$tag does not match manifest version $version" >&2
            exit 1
          fi

      - name: Build nec_pbx.zip
        run: |
          cd custom_components/nec_pbx
          zip -r ../../nec_pbx.zip . -x '__pycache__/*' '*.pyc'

      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="## $version" '$0==v{f=1;next} /^## /{f=0} f' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "See CHANGELOG.md." > notes.md; fi

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" nec_pbx.zip \
            --title "${GITHUB_REF_NAME#v}" \
            --notes-file notes.md
