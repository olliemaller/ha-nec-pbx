name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: hacs/action@main
        with:
          category: integration

  tests:
    name: tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.13 gets the newest Home Assistant that still runs on it; 3.14 gets
        # the latest, which is where deprecations turn into errors first.
        python: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements_test.txt ruff mypy pytest-cov
      - name: Install the integration's requirements
        run: pip install $(python -c "import json,glob;print(' '.join(json.load(open(glob.glob('custom_components/*/manifest.json')[0]))['requirements']))")
      - run: ruff check .
      - run: ruff format --check .
      - name: Strict typing (newest Home Assistant)
        if: matrix.python == '3.14'
        run: mypy --strict --implicit-reexport --ignore-missing-imports custom_components/nec_pbx
      - run: pytest -q --cov=custom_components.nec_pbx --cov-report=term-missing --cov-fail-under=95
