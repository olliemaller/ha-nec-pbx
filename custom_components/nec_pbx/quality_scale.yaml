# Home Assistant integration quality scale: where this integration stands.
# https://contributors.home-assistant.io/core/quality-scale/rules/
# Custom integrations can't declare a tier in manifest.json, so this file is
# a self-assessment against every rule up to Platinum.
rules:
  # Bronze
  action-setup: done
  appropriate-polling:
    status: exempt
    comment: Push. The phone system sends each call as it ends; only the optional FreePBX do-not-disturb switches are read.
  brands:
    status: done
    comment: Icons, logos and dark variants in custom_components/nec_pbx/brand/.
  common-modules:
    status: done
    comment: No coordinator (push); the base entity is in entity.py.
  config-flow: done
  config-flow-test-coverage:
    status: done
    comment: Every config, options, reconfigure and reauth path is tested (config_flow.py 100%).
  dependency-transparency:
    status: done
    comment: aionecpbx is MIT, on PyPI, and published from GitHub Actions with trusted publishing.
  docs-actions:
    status: done
    comment: save_caller and its fields are in docs/Automations.md.
  docs-conditions:
    status: exempt
    comment: No custom conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: No custom triggers; calls are events and event entities.
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup:
    status: exempt
    comment: The call log is a long-lived push connection that reconnects by itself; a Repairs issue appears if it stays down.
  unique-config-entry: done

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable:
    status: done
    comment: Live call and do-not-disturb entities go unavailable without FreePBX; call history stays, since it's still true.
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow:
    status: done
    comment: A rejected FreePBX login opens a reauth flow for the manager user and secret. SMDR itself has no login.
  test-coverage:
    status: done
    comment: 98% overall and at least 95% in every module; CI fails below 95%.

  # Gold
  devices: done
  diagnostics: done
  discovery:
    status: exempt
    comment: NEC phone systems don't announce themselves on the network.
  discovery-update-info:
    status: exempt
    comment: No discovery.
  docs-data-update:
    status: done
    comment: docs/Features.md, "How the data updates".
  docs-examples: done
  docs-known-limitations:
    status: done
    comment: docs/Troubleshooting.md, "Known limitations"; docs/Features.md, "What it can't do".
  docs-supported-devices:
    status: done
    comment: SL2100 tested on hardware; SV9100 layout from sample lines. README, Setup and Troubleshooting agree.
  docs-supported-functions: done
  docs-troubleshooting:
    status: done
    comment: docs/Troubleshooting.md, including FreePBX login and Permit, and debug logging.
  docs-use-cases: done
  dynamic-devices:
    status: exempt
    comment: Extension and line devices come from the options list, which reloads the entry when changed.
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default:
    status: done
    comment: The "Last call log line" diagnostic sensor holds callers' numbers and is disabled by default.
  entity-translations: done
  exception-translations: done
  icon-translations: done
  reconfiguration-flow: done
  repair-issues: done
  stale-devices:
    status: done
    comment: An extension or line taken out of the options can be deleted from its device page.

  # Platinum
  async-dependency: done
  inject-websession:
    status: exempt
    comment: Raw TCP to the phone system and Asterisk manager; no HTTP.
  strict-typing:
    status: done
    comment: mypy --strict is clean and checked in CI; aionecpbx ships py.typed.
